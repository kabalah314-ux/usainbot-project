<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 520" width="340" height="520">
  <defs>
    <!-- Neon green sole glow -->
    <radialGradient id="soleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#00cc55" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00aa44" stop-opacity="0"/>
    </radialGradient>
    <!-- Chrome metallic gradient -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#e8ecef"/>
      <stop offset="30%" stop-color="#b0b8c1"/>
      <stop offset="60%" stop-color="#8a9099"/>
      <stop offset="85%" stop-color="#c5cdd4"/>
      <stop offset="100%" stop-color="#6e7880"/>
    </linearGradient>
    <!-- Dark chrome for joints -->
    <linearGradient id="chromeDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#d0d8df"/>
      <stop offset="40%" stop-color="#8a9099"/>
      <stop offset="70%" stop-color="#5a6268"/>
      <stop offset="100%" stop-color="#3a4248"/>
    </linearGradient>
    <!-- Green thigh armor -->
    <linearGradient id="greenArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#2d8a50"/>
      <stop offset="35%" stop-color="#1a6b38"/>
      <stop offset="70%" stop-color="#0e5228"/>
      <stop offset="100%" stop-color="#1a6b38"/>
    </linearGradient>
    <!-- Green highlight for armor -->
    <linearGradient id="greenHighlight" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%"  stop-color="#4dbd78"/>
      <stop offset="50%" stop-color="#2d8a50"/>
      <stop offset="100%" stop-color="#1a6b38"/>
    </linearGradient>
    <!-- Gold accent -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#e8c060"/>
      <stop offset="50%" stop-color="#c8963e"/>
      <stop offset="100%" stop-color="#a07020"/>
    </linearGradient>
    <!-- Sneaker green -->
    <linearGradient id="sneakerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#3aaa60"/>
      <stop offset="50%" stop-color="#1a7840"/>
      <stop offset="100%" stop-color="#0e5228"/>
    </linearGradient>
    <!-- Shin chrome gradient -->
    <linearGradient id="shinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#c8d0d8"/>
      <stop offset="40%" stop-color="#90a0a8"/>
      <stop offset="100%" stop-color="#607080"/>
    </linearGradient>
    <!-- Glow filter for LED sole -->
    <filter id="glowGreen" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Drop shadow for depth -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="4" stdDeviation="3" flood-color="#0b0b12" flood-opacity="0.5"/>
    </filter>
    <!-- Circuit pattern -->
    <pattern id="circuitPat" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none"/>
      <path d="M2,10 h6 M10,2 v6 M10,10 h8 M10,10 v8 M4,4 h4 v4" stroke="#00ff88" stroke-width="0.6" fill="none" opacity="0.35"/>
      <circle cx="10" cy="10" r="1.2" fill="#00ff88" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- ============================================================ -->
  <!--  PIVOT POINT: top-left ~(30,30) — hip socket                 -->
  <!-- ============================================================ -->

  <!-- ===================== HIP SOCKET ========================== -->
  <!-- Ball joint at top-left, this is origin: 20% 15% in CSS -->
  <g transform="translate(22,18)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="30" fill="url(#chromeDark)" stroke="#0b0b12" stroke-width="3"/>
    <!-- Mid ring -->
    <circle cx="0" cy="0" r="20" fill="url(#chromeGrad)" stroke="#0b0b12" stroke-width="2"/>
    <!-- Inner hub -->
    <circle cx="0" cy="0" r="11" fill="url(#chromeDark)" stroke="#0b0b12" stroke-width="2"/>
    <!-- Center bolt -->
    <circle cx="0" cy="0" r="5" fill="#2a3038" stroke="#8a9099" stroke-width="1.5"/>
    <!-- Highlight -->
    <ellipse cx="-7" cy="-7" rx="6" ry="4" fill="white" opacity="0.25" transform="rotate(-30)"/>
    <!-- Radial bolts -->
    <circle cx="22" cy="0"  r="2.5" fill="#5a6268" stroke="#0b0b12" stroke-width="1"/>
    <circle cx="-22" cy="0" r="2.5" fill="#5a6268" stroke="#0b0b12" stroke-width="1"/>
    <circle cx="0" cy="22"  r="2.5" fill="#5a6268" stroke="#0b0b12" stroke-width="1"/>
    <circle cx="0" cy="-22" r="2.5" fill="#5a6268" stroke="#0b0b12" stroke-width="1"/>
  </g>

  <!-- ===================== THIGH ARMOR ========================= -->
  <!-- Goes from hip (top-left) diagonally down-right to knee -->
  <!-- Thigh shape: trapezoidal panel, slightly curved -->
  <g filter="url(#shadow)">
    <!-- Main thigh body -->
    <path d="M 20,40 C 35,38 80,38 110,52 L 160,145 C 155,162 145,170 130,172 C 110,175 80,165 60,155 Z"
          fill="url(#greenArmor)" stroke="#0b0b12" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Thigh highlight panel -->
    <path d="M 28,50 C 45,46 85,46 110,58 L 145,130 C 128,140 105,145 85,140 Z"
          fill="url(#greenHighlight)" opacity="0.5"/>
    <!-- Circuit overlay on thigh -->
    <path d="M 20,40 C 35,38 80,38 110,52 L 160,145 C 155,162 145,170 130,172 C 110,175 80,165 60,155 Z"
          fill="url(#circuitPat)" opacity="0.6"/>
    <!-- Thigh top accent strip (gold) -->
    <path d="M 22,46 C 40,42 78,42 108,55 L 115,68 C 80,58 42,58 25,62 Z"
          fill="url(#goldGrad)" stroke="#0b0b12" stroke-width="1.5"/>
    <!-- Thigh center panel line -->
    <path d="M 65,52 L 125,158" stroke="#00ff88" stroke-width="1.2" opacity="0.6" stroke-dasharray="4,3"/>
    <!-- Panel rivets on thigh -->
    <circle cx="45"  cy="68"  r="3.5" fill="#1a6b38" stroke="#0b0b12" stroke-width="1.5"/>
    <circle cx="95"  cy="58"  r="3.5" fill="#1a6b38" stroke="#0b0b12" stroke-width="1.5"/>
    <circle cx="100" cy="130" r="3.5" fill="#1a6b38" stroke="#0b0b12" stroke-width="1.5"/>
    <circle cx="52"  cy="140" r="3.5" fill="#1a6b38" stroke="#0b0b12" stroke-width="1.5"/>
    <!-- Side circuit lines -->
    <path d="M 35,80 h18 M 35,85 h10" stroke="#00ff88" stroke-width="1" opacity="0.5"/>
    <path d="M 90,100 h16 M 90,105 h10" stroke="#00ff88" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- ===================== KNEE JOINT ========================== -->
  <!-- Chrome mechanical knee, center around (138, 175) -->
  <g transform="translate(118,168)" filter="url(#shadow)">
    <!-- Outer knee housing -->
    <ellipse cx="22" cy="0" rx="38" ry="30" fill="url(#chromeDark)" stroke="#0b0b12" stroke-width="3"/>
    <!-- Inner plate -->
    <ellipse cx="22" cy="0" rx="26" ry="20" fill="url(#chromeGrad)" stroke="#0b0b12" stroke-width="2"/>
    <!-- Knee cap center -->
    <ellipse cx="22" cy="0" rx="14" ry="11" fill="url(#chromeDark)" stroke="#0b0b12" stroke-width="2"/>
    <!-- Center bolt -->
    <circle cx="22" cy="0" r="5.5" fill="#2a3038" stroke="#8a9099" stroke-width="1.5"/>
    <circle cx="22" cy="0" r="2.5" fill="#5a6268"/>
    <!-- Highlight shine -->
    <ellipse cx="10" cy="-6" rx="8" ry="5" fill="white" opacity="0.22" transform="rotate(-20,10,-6)"/>
    <!-- Side pistons -->
    <rect x="-8"  y="-5" width="14" height="10" rx="3" fill="url(#chromeGrad)" stroke="#0b0b12" stroke-width="1.5"/>
    <rect x="48"  y="-5" width="14" height="10" rx="3" fill="url(#chromeGrad)" stroke="#0b0b12" stroke-width="1.5"/>
    <!-- Piston detail lines -->
    <line x1="-2"  y1="-2" x2="-2"  y2="2" stroke="#8a9099" stroke-width="1.5"/>
    <line x1="54"  y1="-2" x2="54"  y2="2" stroke="#8a9099" stroke-width="1.5"/>
    <!-- Gold accent ring around knee -->
    <ellipse cx="22" cy="0" rx="31" ry="23" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.7"/>
    <!-- Green LED dot on knee -->
    <circle cx="22" cy="-16" r="3" fill="#00ff88" stroke="#0b0b12" stroke-width="1" filter="url(#glowGreen)"/>
  </g>

  <!-- ===================== HYDRAULIC PISTONS =================== -->
  <!-- Behind knee, visible mechanical hydraulics -->
  <g opacity="0.85">
    <!-- Piston cylinder 1 -->
    <rect x="148" y="162" width="10" height="36" rx="4" fill="url(#chromeGrad)" stroke="#0b0b12" stroke-width="1.5" transform="rotate(15,153,180)"/>
    <!-- Piston rod 1 -->
    <rect x="150" y="188" width="6"  height="28" rx="2" fill="#d0d8df" stroke="#8a9099" stroke-width="1" transform="rotate(15,153,200)"/>
    <!-- Piston cylinder 2 -->
    <rect x="116" y="158" width="10" height="32" rx="4" fill="url(#chromeGrad)" stroke="#0b0b12" stroke-width="1.5" transform="rotate(-10,121,174)"/>
    <!-- Green glow line on piston -->
    <path d="M 150,175 L 156,200" stroke="#00ff88" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- ===================== SHIN ARMOR ========================== -->
  <!-- Goes from knee (~156,195) diagonally down-right to ankle -->
  <g filter="url(#shadow)">
    <!-- Main shin shape -->
    <path d="M 128,188 C 148,185 178,190 196,202 L 248,340 C 245,358 232,368 215,366 C 195,365 168,352 150,338 Z"
          fill="url(#shinGrad)" stroke="#0b0b12" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Shin highlight -->
    <path d="M 140,196 C 158,192 180,196 194,208 L 232,316 C 218,328 198,330 184,322 Z"
          fill="white" opacity="0.12"/>
    <!-- Shin front guard panel -->
    <path d="M 148,200 C 165,196 186,202 198,212 L 232,308 C 215,318 192,316 175,306 Z"
          fill="url(#chromeGrad)" opacity="0.35" stroke="#0b0b12" stroke-width="1.5"/>
    <!-- Hydraulic detail lines on shin -->
    <path d="M 155,220 L 210,340" stroke="#8a9099" stroke-width="2" opacity="0.4"/>
    <path d="M 165,218 L 220,338" stroke="#8a9099" stroke-width="1.2" opacity="0.3"/>
    <!-- Green circuit stripe -->
    <path d="M 150,230 L 200,350" stroke="#00ff88" stroke-width="1.5" opacity="0.45" stroke-dasharray="6,4"/>
    <!-- Panel bolts on shin -->
    <circle cx="160" cy="228" r="3" fill="#5a6268" stroke="#0b0b12" stroke-width="1.5"/>
    <circle cx="190" cy="248" r="3" fill="#5a6268" stroke="#0b0b12" stroke-width="1.5"/>
    <circle cx="210" cy="310" r="3" fill="#5a6268" stroke="#0b0b12" stroke-width="1.5"/>
    <circle cx="180" cy="330" r="3" fill="#5a6268" stroke="#0b0b12" stroke-width="1.5"/>
  </g>

  <!-- ===================== ANKLE JOINT ========================= -->
  <g transform="translate(182,352)" filter="url(#shadow)">
    <ellipse cx="20" cy="0" rx="32" ry="18" fill="url(#chromeDark)" stroke="#0b0b12" stroke-width="2.5"/>
    <ellipse cx="20" cy="0" rx="20" ry="11" fill="url(#chromeGrad)" stroke="#0b0b12" stroke-width="1.5"/>
    <circle  cx="20" cy="0" r="5"   fill="#2a3038" stroke="#8a9099" stroke-width="1.5"/>
    <!-- Ankle LED -->
    <circle cx="20" cy="-8" r="2.5" fill="#00ff88" filter="url(#glowGreen)"/>
    <!-- Ankle bolt sides -->
    <circle cx="-8" cy="0" r="3" fill="url(#goldGrad)" stroke="#0b0b12" stroke-width="1"/>
    <circle cx="48" cy="0" r="3" fill="url(#goldGrad)" stroke="#0b0b12" stroke-width="1"/>
  </g>

  <!-- ===================== SNEAKER ============================ -->
  <!-- Green high-tech sneaker, angled right, at bottom-right -->
  <g transform="translate(168,368)" filter="url(#shadow)">
    <!-- Sneaker body main -->
    <path d="M 0,0 C 10,-8 60,-12 105,-5 C 138,0 158,14 165,30 C 168,40 160,55 140,60 L 80,65 C 40,66 10,58 2,45 C -4,34 -4,14 0,0 Z"
          fill="url(#sneakerGrad)" stroke="#0b0b12" stroke-width="3.5"/>
    <!-- Sneaker top highlight -->
    <path d="M 10,4 C 22,-4 65,-8 105,0 C 128,6 144,18 148,30 C 125,18 80,12 30,16 Z"
          fill="#4dbd78" opacity="0.45"/>
    <!-- Tongue/top panel -->
    <path d="M 5,0 C 15,-6 45,-10 70,-8 L 72,22 C 50,20 18,18 6,12 Z"
          fill="#2d8a50" stroke="#0b0b12" stroke-width="1.5"/>
    <!-- Side panels (tech grid) -->
    <path d="M 35,5 h20 M 35,10 h20 M 35,15 h14" stroke="#00ff88" stroke-width="1" opacity="0.5"/>
    <path d="M 90,2  h20 M 90,7  h20 M 90,12 h14" stroke="#00ff88" stroke-width="1" opacity="0.5"/>
    <!-- Midsole chrome stripe -->
    <path d="M 2,48 C 14,52 60,56 140,50 L 160,40 C 135,46 60,50 4,42 Z"
          fill="url(#chromeGrad)" stroke="#0b0b12" stroke-width="1.5"/>
    <!-- Outsole / bottom -->
    <path d="M 0,52 C 10,60 60,68 140,62 L 168,54 C 145,62 65,68 2,56 Z"
          fill="#0e3a20" stroke="#0b0b12" stroke-width="2"/>
    <!-- LED dots on sole side (glowing green) -->
    <g filter="url(#glowGreen)">
      <circle cx="30"  cy="55" r="3.5" fill="#00ff88"/>
      <circle cx="52"  cy="58" r="3.5" fill="#00ff88"/>
      <circle cx="74"  cy="60" r="3.5" fill="#00ff88"/>
      <circle cx="96"  cy="60" r="3.5" fill="#00ff88"/>
      <circle cx="118" cy="58" r="3.5" fill="#00ff88"/>
      <circle cx="140" cy="55" r="3.5" fill="#00ff88"/>
    </g>
    <!-- Lace eyelets -->
    <circle cx="18" cy="8"  r="2.5" fill="#0e3a20" stroke="#8a9099" stroke-width="1"/>
    <circle cx="25" cy="5"  r="2.5" fill="#0e3a20" stroke="#8a9099" stroke-width="1"/>
    <circle cx="32" cy="3"  r="2.5" fill="#0e3a20" stroke="#8a9099" stroke-width="1"/>
    <circle cx="39" cy="2"  r="2.5" fill="#0e3a20" stroke="#8a9099" stroke-width="1"/>
    <circle cx="46" cy="1"  r="2.5" fill="#0e3a20" stroke="#8a9099" stroke-width="1"/>
    <!-- Laces -->
    <path d="M 18,8 L 25,5 L 32,3 L 39,2 L 46,1" stroke="#e8ecef" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
    <!-- Brand tick (swoosh-style gold) -->
    <path d="M 70,20 C 90,12 125,18 145,28 C 120,22 92,20 72,26 Z"
          fill="url(#goldGrad)" opacity="0.8"/>
    <!-- Heel gold accent -->
    <path d="M 140,8 C 155,14 162,26 160,38 C 155,28 148,18 138,12 Z"
          fill="url(#goldGrad)" opacity="0.7"/>
  </g>

  <!-- ===================== NEON GLOW SOLE UNDER SHOE =========== -->
  <!-- Green energy trail / glow beneath the sneaker -->
  <g opacity="0.85">
    <!-- Main glow ellipse -->
    <ellipse cx="256" cy="440" rx="80" ry="14" fill="url(#soleGlow)" filter="url(#glowGreen)"/>
    <!-- Streak lines -->
    <path d="M 178,442 Q 190,448 340,436" stroke="#00ff88" stroke-width="2.5" fill="none" opacity="0.6" stroke-linecap="round"/>
    <path d="M 178,446 Q 200,452 340,440" stroke="#00ff88" stroke-width="1.5" fill="none" opacity="0.35" stroke-linecap="round"/>
    <!-- Speed sparks -->
    <path d="M 175,435 L 168,428 M 175,435 L 165,438 M 175,435 L 170,445" stroke="#00ff88" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M 190,446 L 184,440 M 190,446 L 183,449" stroke="#00ff88" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- ===================== OUTLINE PASS (top layer ink) ========= -->
  <!-- Re-stroke key outlines for that thick comic ink look -->
  <path d="M 20,40 C 35,38 80,38 110,52 L 160,145 C 155,162 145,170 130,172 C 110,175 80,165 60,155 Z"
        fill="none" stroke="#0b0b12" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M 128,188 C 148,185 178,190 196,202 L 248,340 C 245,358 232,368 215,366 C 195,365 168,352 150,338 Z"
        fill="none" stroke="#0b0b12" stroke-width="3.5" stroke-linejoin="round"/>
</svg>
